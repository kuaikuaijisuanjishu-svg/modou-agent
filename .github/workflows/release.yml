name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.in
      - run: pip install -r requirements-agent.in
      - name: Scan public tree and frozen release Notes
        run: python tools/public_release_check.py --root "$GITHUB_WORKSPACE" --notes-file "docs/release/${GITHUB_REF_NAME}.md"
      - name: Verify release metadata and public tree
        env:
          EXPECTED_PUBLIC_TREE_SHA256: ${{ vars.PUBLIC_TREE_SHA256 }}
          EXPECTED_RELEASE_NOTES_SHA256: ${{ vars.RELEASE_NOTES_SHA256 }}
          EXPECTED_PUBLIC_COMMIT: ${{ vars.PUBLIC_COMMIT_SHA }}
        run: |
          python tools/release_metadata.py verify \
            --tag "$GITHUB_REF_NAME" \
            --expected-tree-sha256 "$EXPECTED_PUBLIC_TREE_SHA256" \
            --expected-notes-sha256 "$EXPECTED_RELEASE_NOTES_SHA256" \
            --expected-public-commit "$EXPECTED_PUBLIC_COMMIT"
      - run: python tests/run.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="docs/release/${tag}.md"
          title="水木验码 $tag"
          if existing="$(gh release view "$tag" --json isPrerelease,body,name,targetCommitish 2>/dev/null)"; then
            RELEASE_JSON="$existing" python tools/release_metadata.py verify-existing-release \
              --tag "$tag" --notes-file "$notes" --title "$title" \
              --expected-public-commit "${{ vars.PUBLIC_COMMIT_SHA }}"
          else
            gh release create "$tag" --title "$title" --prerelease --notes-file "$notes"
          fi
